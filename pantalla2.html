<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antes de votar — Mi Primera Casilla</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/componentes.css">
  <link rel="stylesheet" href="styles/accesibilidad.css">
  <style>
    /* === Checklist animado === */
    .checklist__item {
      opacity: 0;
      transform: translateY(30px) scale(0.95);
      transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .checklist__item--visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .checklist__item--marcado {
      transform: scale(1.02);
    }

    .checklist__item--marcado .checklist__icono {
      animation: iconoPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .checklist__item--marcado .checklist__check {
      animation: checkPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes iconoPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.4) rotate(10deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    @keyframes checkPop {
      0% { transform: scale(0) rotate(-90deg); }
      60% { transform: scale(1.3) rotate(10deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    /* Efecto shimmer al completar todo */
    .checklist--completo .checklist__item--marcado {
      background: linear-gradient(90deg, #f0faf0 0%, #e0f7e0 50%, #f0faf0 100%);
      background-size: 200% 100%;
      animation: shimmer 2s ease infinite;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* === Dato curioso animado === */
    .dato-curioso-card {
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.8s ease;
    }

    .dato-curioso-card--visible {
      opacity: 1;
      transform: translateY(0);
    }

    .dato-curioso-card .foco {
      display: inline-block;
      animation: foquito 2s ease infinite;
    }

    @keyframes foquito {
      0%, 100% { transform: rotate(0deg) scale(1); filter: brightness(1); }
      25% { transform: rotate(-10deg) scale(1.1); filter: brightness(1.3); }
      50% { transform: rotate(5deg) scale(1.05); filter: brightness(1.1); }
    }

    /* === Mapa simulado mejorado === */
    .mapa-simulado {
      background: linear-gradient(135deg, #e8f0e8 0%, #d4e4d4 100%);
      border: 2px solid var(--color-borde);
      border-radius: var(--radio-borde);
      padding: 2rem 1rem;
      text-align: center;
      position: relative;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      overflow: hidden;
      transition: all 0.5s ease;
    }

    .mapa-simulado--encontrado {
      border-color: var(--color-exito);
      background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
    }

    .mapa-simulado__pin {
      font-size: 3rem;
      animation: pinFloat 2s ease-in-out infinite;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
    }

    @keyframes pinFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .mapa-simulado--encontrado .mapa-simulado__pin {
      animation: pinDrop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes pinDrop {
      0% { transform: translateY(-40px) scale(0.5); opacity: 0; }
      60% { transform: translateY(5px) scale(1.1); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    .mapa-simulado__texto {
      font-weight: 700;
      color: var(--color-secundario);
      transition: all 0.3s ease;
    }

    .mapa-simulado--encontrado .mapa-simulado__texto {
      color: var(--color-exito);
      font-size: 1.1rem;
    }

    .mapa-simulado__sub {
      font-size: 0.82rem;
      color: #666;
    }

    .mapa-simulado__ondas {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid var(--color-exito);
      opacity: 0;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -60%);
      pointer-events: none;
    }

    .mapa-simulado--encontrado .mapa-simulado__ondas {
      animation: ondas 1.5s ease-out infinite;
    }

    .mapa-simulado--encontrado .mapa-simulado__ondas:nth-child(2) {
      animation-delay: 0.5s;
    }

    @keyframes ondas {
      0% { width: 30px; height: 30px; opacity: 0.6; }
      100% { width: 120px; height: 120px; opacity: 0; }
    }

    .seccion-input-mapa {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .seccion-input-mapa .campo__input { flex: 1; }
    .seccion-input-mapa .btn { flex-shrink: 0; padding: 0.75rem 1.2rem; font-size: 0.9rem; }

    /* === Quiz mejorado === */
    .quiz-contador {
      text-align: center;
      font-size: 0.85rem;
      color: #999;
      margin-bottom: 1rem;
    }

    .quiz__opcion {
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .quiz__opcion:hover {
      transform: translateX(6px);
    }

    .quiz__opcion--correcta {
      animation: respuestaCorrecta 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .quiz__opcion--incorrecta {
      animation: shake 0.5s ease;
    }

    @keyframes respuestaCorrecta {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }

    .quiz__feedback {
      animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* === Secciones con scroll reveal === */
    .seccion-animada {
      opacity: 0;
      transform: translateY(40px);
      transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .seccion-animada--visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* === Título con typing effect === */
    .titulo-animado {
      overflow: hidden;
      border-right: 3px solid var(--color-primario);
      white-space: nowrap;
      animation: typing 1s steps(15) forwards, blink 0.7s step-end infinite;
      width: 0;
      display: inline-block;
    }

    .titulo-animado--completo {
      width: auto;
      border-right: none;
      animation: none;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }

    @keyframes blink {
      50% { border-color: transparent; }
    }
  </style>
</head>
<body>
  <div id="barra-progreso"></div>

  <button class="acc-boton" aria-label="Opciones de accesibilidad" title="Accesibilidad">♿</button>
  <div class="acc-panel" role="dialog" aria-label="Panel de accesibilidad">
    <div class="acc-panel__titulo">Accesibilidad</div>
    <button class="acc-panel__opcion" data-acc="voz"><span class="acc-panel__icono">🔊</span> Narración por voz</button>
    <button class="acc-panel__opcion" data-acc="lectura_facil"><span class="acc-panel__icono">📖</span> Lectura fácil</button>
    <button class="acc-panel__opcion" data-acc="alto_contraste"><span class="acc-panel__icono">🌗</span> Alto contraste</button>
  </div>
  <div class="voz-controles" aria-label="Controles de narración">
    <button class="voz-controles__btn voz-btn-pausar" aria-label="Pausar" title="Pausar">⏸️</button>
    <button class="voz-controles__btn voz-btn-repetir" aria-label="Repetir" title="Repetir">🔁</button>
    <button class="voz-controles__btn voz-btn-detener" aria-label="Detener" title="Detener">⏹️</button>
  </div>

  <main class="pantalla">
    <div class="contenido-principal">
      <section class="text-center mb-2">
        <h1>Antes de votar</h1>
        <p data-texto-normal="Todo lo que necesitas saber antes del gran día"
           data-texto-facil="Aquí te decimos qué llevar y cómo encontrar tu casilla.">Todo lo que necesitas saber antes del gran día</p>
      </section>

      <!-- A) Checklist -->
      <section class="mb-3 seccion-animada" id="seccion-checklist">
        <h2 class="mb-1">¿Qué necesitas llevar?</h2>
        <ul class="checklist" id="checklist" aria-label="Lista de requisitos para votar"></ul>
      </section>

      <!-- Dato curioso -->
      <div class="tarjeta tarjeta--destacada mb-3 dato-curioso-card seccion-animada" id="dato-curioso">
        <strong><span class="foco">💡</span> Dato curioso</strong>
        <p class="mt-1" id="dato-curioso-texto"
           data-texto-normal=""
           data-texto-facil=""></p>
      </div>

      <!-- B) Mapa simulado -->
      <section class="mb-3 seccion-animada" id="seccion-mapa">
        <h2 class="mb-1">¿Cómo encuentras tu casilla?</h2>
        <div class="seccion-input-mapa">
          <input class="campo__input" type="text" id="input-seccion-mapa" placeholder="Tu sección electoral" inputmode="numeric" maxlength="6">
          <button class="btn btn--secundario" id="btn-buscar-casilla">Buscar</button>
        </div>
        <div class="mapa-simulado" id="mapa-simulado">
          <div class="mapa-simulado__ondas"></div>
          <div class="mapa-simulado__ondas"></div>
          <span class="mapa-simulado__pin">📍</span>
          <span class="mapa-simulado__texto">Tu casilla está cerca</span>
          <span class="mapa-simulado__sub" id="mapa-ayuda"></span>
        </div>
      </section>

      <!-- C) Mini-quiz -->
      <section class="mb-3 seccion-animada" id="seccion-quiz">
        <hr class="separador">
        <h2 class="mb-1">Verifica lo que aprendiste</h2>
        <p class="quiz-contador" id="quiz-contador"></p>
        <div class="quiz" id="quiz-contenedor"></div>
      </section>

      <button class="btn btn--primario btn--grande mt-2" id="btn-siguiente"
              onclick="irAPantalla('pantalla3.html')">
        Siguiente: El gran día →
      </button>
    </div>
  </main>

  <script src="js/navegacion.js"></script>
  <script src="js/accesibilidad.js"></script>
  <script>
    renderBarraProgreso(2, document.getElementById('barra-progreso'));

    var seccion = obtenerSeccion();
    if (seccion) {
      document.getElementById('input-seccion-mapa').value = seccion;
    }

    // Scroll reveal observer
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('seccion-animada--visible');
        }
      });
    }, { threshold: 0.15 });

    document.querySelectorAll('.seccion-animada').forEach(function(el) {
      observer.observe(el);
    });

    cargarContenido().then(function(data) {
      var p2 = data.pantallas.p2;

      // Checklist con animación escalonada
      var checklistEl = document.getElementById('checklist');
      var totalItems = p2.checklist.length;
      var marcados = 0;

      p2.checklist.forEach(function(item, i) {
        var li = document.createElement('li');
        li.className = 'checklist__item';
        li.setAttribute('tabindex', '0');
        li.setAttribute('role', 'checkbox');
        li.setAttribute('aria-checked', 'false');
        li.innerHTML =
          '<span class="checklist__icono">' + item.icono + '</span>' +
          '<div class="checklist__texto">' +
            '<strong data-texto-normal="' + item.texto + '" data-texto-facil="' + item.texto + '">' + item.texto + '</strong>' +
            '<small data-texto-normal="' + item.detalle + '" data-texto-facil="' + item.detalle + '">' + item.detalle + '</small>' +
          '</div>' +
          '<div class="checklist__check" aria-hidden="true">✓</div>';

        li.addEventListener('click', function() {
          var yaMarcado = li.classList.contains('checklist__item--marcado');
          li.classList.toggle('checklist__item--marcado');
          li.setAttribute('aria-checked', !yaMarcado ? 'true' : 'false');
          marcados += yaMarcado ? -1 : 1;
          if (marcados === totalItems) {
            checklistEl.classList.add('checklist--completo');
          } else {
            checklistEl.classList.remove('checklist--completo');
          }
        });
        li.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); li.click(); }
        });

        checklistEl.appendChild(li);

        // Animación escalonada de entrada
        setTimeout(function() {
          li.classList.add('checklist__item--visible');
        }, 200 * (i + 1));
      });

      // Dato curioso
      var datoEl = document.getElementById('dato-curioso-texto');
      datoEl.textContent = p2.dato_curioso;
      datoEl.setAttribute('data-texto-normal', p2.dato_curioso);
      datoEl.setAttribute('data-texto-facil', p2.dato_curioso_facil);

      // Mapa
      var mapaAyuda = document.getElementById('mapa-ayuda');
      mapaAyuda.textContent = p2.mapa.texto_ayuda;
      mapaAyuda.setAttribute('data-texto-normal', p2.mapa.texto_ayuda);
      mapaAyuda.setAttribute('data-texto-facil', p2.mapa.texto_ayuda_facil);

      document.getElementById('btn-buscar-casilla').addEventListener('click', function() {
        var val = document.getElementById('input-seccion-mapa').value.trim();
        var mapa = document.getElementById('mapa-simulado');
        var mapaTexto = document.querySelector('.mapa-simulado__texto');
        if (val) {
          mapa.classList.add('mapa-simulado--encontrado');
          mapaTexto.textContent = 'Sección ' + val + ' — Casilla Básica 1';
        } else {
          mapa.classList.remove('mapa-simulado--encontrado');
          mapaTexto.textContent = 'Ingresa tu sección para buscar';
        }
      });

      // Quiz
      var quizContenedor = document.getElementById('quiz-contenedor');
      var correctas = 0;
      var contestadas = 0;
      var total = p2.quiz.length;
      var contadorEl = document.getElementById('quiz-contador');
      contadorEl.textContent = correctas + ' de ' + total + ' correctas';

      p2.quiz.forEach(function(q, qi) {
        var div = document.createElement('div');
        div.className = 'tarjeta mb-1';

        var pregHTML = '<p class="quiz__pregunta">' + (qi + 1) + '. ' + q.pregunta + '</p>';
        pregHTML += '<div class="quiz__opciones">';
        q.opciones.forEach(function(op, oi) {
          pregHTML += '<button class="quiz__opcion" data-quiz="' + qi + '" data-opcion="' + oi + '">' + op + '</button>';
        });
        pregHTML += '</div>';
        pregHTML += '<div class="quiz__feedback" id="quiz-fb-' + qi + '" style="display:none"></div>';
        div.innerHTML = pregHTML;

        div.querySelectorAll('.quiz__opcion').forEach(function(btn) {
          btn.addEventListener('click', function() {
            var qIdx = parseInt(btn.getAttribute('data-quiz'));
            var oIdx = parseInt(btn.getAttribute('data-opcion'));
            var esCorrecta = oIdx === p2.quiz[qIdx].correcta;
            var feedback = document.getElementById('quiz-fb-' + qIdx);
            var opciones = div.querySelectorAll('.quiz__opcion');

            opciones.forEach(function(b) { b.disabled = true; });

            if (esCorrecta) {
              btn.classList.add('quiz__opcion--correcta');
              feedback.className = 'quiz__feedback quiz__feedback--correcto';
              feedback.textContent = '✅ ¡Correcto! ' + (document.body.classList.contains('lectura-facil')
                ? p2.quiz[qIdx].explicacion_facil : p2.quiz[qIdx].explicacion);
              correctas++;
            } else {
              btn.classList.add('quiz__opcion--incorrecta');
              opciones[p2.quiz[qIdx].correcta].classList.add('quiz__opcion--correcta');
              feedback.className = 'quiz__feedback quiz__feedback--incorrecto';
              feedback.textContent = '❌ ' + (document.body.classList.contains('lectura-facil')
                ? p2.quiz[qIdx].explicacion_facil : p2.quiz[qIdx].explicacion);
            }

            feedback.style.display = 'block';
            contestadas++;
            contadorEl.textContent = correctas + ' de ' + total + ' correctas';

            // Guardar score para pantalla 5
            sessionStorage.setItem('quizCorrectas', correctas);
            sessionStorage.setItem('quizTotal', total);
          });
        });

        quizContenedor.appendChild(div);
      });
    });
  </script>
</body>
</html>
