<!DOCTYPE html>
<html lang="es-MX">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antes de votar — Mi Primera Casilla</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/componentes.css">
  <link rel="stylesheet" href="styles/accesibilidad.css">
  <style>
    /* === Checklist (solo visual, sin interacción) === */
    .checklist__item {
      opacity: 0;
      transform: translateY(30px) scale(0.95);
      transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: default;
    }

    .checklist__item--visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* === Dato curioso animado === */
    .dato-curioso-card {
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.8s ease;
    }

    .dato-curioso-card--visible {
      opacity: 1;
      transform: translateY(0);
    }


    /* === Mapa simulado mejorado === */
    /* === Mapa / Buscar casilla === */
    .mapa-buscar {
      background: #fff;
      border: 2px solid var(--color-borde);
      border-radius: var(--radio-borde);
      padding: 1.5rem;
      transition: border-color 0.3s ease;
    }

    .mapa-buscar__label {
      font-size: 0.88rem;
      color: #666;
      margin-bottom: 0.75rem;
      display: block;
    }

    .mapa-buscar__row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0;
    }

    .mapa-buscar__row .campo__input {
      flex: 1;
    }

    .mapa-buscar__row .btn {
      flex-shrink: 0;
      padding: 0.75rem 1.2rem;
      font-size: 0.9rem;
    }

    .mapa-buscar__resultado {
      display: none;
      margin-top: 1rem;
      padding: 1rem;
      border-radius: var(--radio-borde);
      background: linear-gradient(135deg, #e8f5e9 0%, #f1f8e9 100%);
      border-left: 4px solid var(--color-exito);
      animation: resultadoEntra 0.4s ease;
    }

    .mapa-buscar__resultado--visible {
      display: block;
    }

    @keyframes resultadoEntra {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .mapa-buscar__casilla {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--color-exito);
      margin-bottom: 0.35rem;
    }

    .mapa-buscar__ayuda {
      font-size: 0.82rem;
      color: #555;
      margin: 0;
    }

    .mapa-buscar__ayuda a {
      color: var(--color-secundario);
      font-weight: 600;
      text-decoration: underline;
    }

    /* === Quiz mejorado === */
    .quiz-contador {
      text-align: center;
      font-size: 0.85rem;
      color: #999;
      margin-bottom: 1rem;
    }

    .quiz__opcion {
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .quiz__opcion:hover {
      transform: translateX(6px);
    }

    .quiz__opcion--correcta {
      animation: respuestaCorrecta 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .quiz__opcion--incorrecta {
      animation: shake 0.5s ease;
    }

    @keyframes respuestaCorrecta {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(-8px);
      }

      40% {
        transform: translateX(8px);
      }

      60% {
        transform: translateX(-5px);
      }

      80% {
        transform: translateX(5px);
      }
    }

    .quiz__feedback {
      animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* === Secciones con scroll reveal === */
    .seccion-animada {
      opacity: 0;
      transform: translateY(40px);
      transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .seccion-animada--visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* === Título con typing effect === */
    .titulo-animado {
      overflow: hidden;
      border-right: 3px solid var(--color-primario);
      white-space: nowrap;
      animation: typing 1s steps(15) forwards, blink 0.7s step-end infinite;
      width: 0;
      display: inline-block;
    }

    .titulo-animado--completo {
      width: auto;
      border-right: none;
      animation: none;
    }

    @keyframes typing {
      from {
        width: 0;
      }

      to {
        width: 100%;
      }
    }

    @keyframes blink {
      50% {
        border-color: transparent;
      }
    }
  </style>
</head>

<body>
  <div id="barra-progreso"></div>

  <button class="acc-boton" aria-label="Opciones de accesibilidad" title="Accesibilidad">
     <img src="images/wheelchair-solid-full.svg" alt="ICONO">
  </button>
  <div class="acc-panel" role="dialog" aria-label="Panel de accesibilidad">
    <div class="acc-panel__titulo">Accesibilidad</div>
    <button class="acc-panel__opcion" data-acc="voz"><span class="acc-panel__icono">🔊</span> Narración por voz</button>
    <button class="acc-panel__opcion" data-acc="lectura_facil"><span class="acc-panel__icono">📖</span> Lectura
      fácil</button>
    <button class="acc-panel__opcion" data-acc="alto_contraste"><span class="acc-panel__icono">🌗</span> Alto
      contraste</button>
  </div>
  <div class="voz-controles" aria-label="Controles de narración">
    <button class="voz-controles__btn voz-btn-pausar" aria-label="Pausar" title="Pausar">⏸️</button>
    <button class="voz-controles__btn voz-btn-repetir" aria-label="Repetir" title="Repetir">🔁</button>
    <button class="voz-controles__btn voz-btn-detener" aria-label="Detener" title="Detener">⏹️</button>
  </div>

  <main class="pantalla">
    <div class="contenido-principal">
      <section class="text-center mb-2">
        <h1>Antes de votar</h1>
        <p data-texto-normal="Todo lo que necesitas saber antes del gran día"
          data-texto-facil="Aquí te decimos qué llevar y cómo encontrar tu casilla.">Todo lo que necesitas saber antes
          del gran día</p>
      </section>

      <!-- A) Checklist -->
      <section class="mb-3 seccion-animada" id="seccion-checklist">
        <h2 class="mb-1">Lo que debes llevar:</h2>
        <ul class="checklist" id="checklist" aria-label="Lista de requisitos para votar"></ul>
      </section>

      <!-- Dato curioso -->
      <div class="tarjeta tarjeta--destacada dato-lateral dato-lateral--izq mb-3 dato-curioso-card seccion-animada" id="dato-curioso">
        <strong>Dato curioso</strong>
        <p class="mt-1" id="dato-curioso-texto" data-texto-normal="" data-texto-facil=""></p>
      </div>

      <!-- B) Buscar casilla -->
      <section class="mb-3 seccion-animada" id="seccion-mapa">
        <h2 class="mb-1">Encuentra tu casilla</h2>
        <div class="mapa-buscar">
          <span class="mapa-buscar__label">Ingresa tu sección electoral para localizar tu casilla:</span>
          <div class="mapa-buscar__row">
            <input class="campo__input" type="text" id="input-seccion-mapa" placeholder="Ej. 1234"
              inputmode="numeric" maxlength="6">
            <button class="btn btn--secundario" id="btn-buscar-casilla">Buscar</button>
          </div>
          <div class="mapa-buscar__resultado" id="mapa-resultado">
            <div class="mapa-buscar__casilla" id="mapa-casilla-texto"></div>
            <p class="mapa-buscar__ayuda" id="mapa-ayuda"></p>
          </div>
        </div>
      </section>

      <!-- C) Mini-quiz -->
      <section class="mb-3 seccion-animada" id="seccion-quiz">
        <hr class="separador">
        <h2 class="mb-1">Verifica lo que aprendiste</h2>
        <p class="quiz-contador" id="quiz-contador"></p>
        <div class="quiz" id="quiz-contenedor"></div>
      </section>

      <button class="btn btn--primario btn--grande mt-2" id="btn-siguiente" onclick="irAPantalla('pantalla3.html')"
        disabled title="Completa el quiz para continuar">
        Siguiente: El gran día →
      </button>
    </div>
  </main>

  <script src="js/navegacion.js"></script>
  <script src="js/accesibilidad.js"></script>
  <script>
    renderBarraProgreso(2, document.getElementById('barra-progreso'));

    var seccion = obtenerSeccion();
    if (seccion) {
      document.getElementById('input-seccion-mapa').value = seccion;
    }

    // Scroll reveal observer
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('seccion-animada--visible');
        }
      });
    }, { threshold: 0.15 });

    document.querySelectorAll('.seccion-animada').forEach(function (el) {
      observer.observe(el);
    });

    cargarContenido().then(function (data) {
      var p2 = data.pantallas.p2;

      // Checklist con animación escalonada
      var checklistEl = document.getElementById('checklist');
      var totalItems = p2.checklist.length;
      var marcados = 0;

      p2.checklist.forEach(function (item, i) {
        var li = document.createElement('li');
        li.className = 'checklist__item';
        li.innerHTML =
          '<span class="checklist__icono">' + item.icono + '</span>' +
          '<div class="checklist__texto">' +
          '<strong data-texto-normal="' + item.texto + '" data-texto-facil="' + item.texto + '">' + item.texto + '</strong>' +
          '<small data-texto-normal="' + item.detalle + '" data-texto-facil="' + item.detalle + '">' + item.detalle + '</small>' +
          '</div>';

        checklistEl.appendChild(li);

        // Animación escalonada de entrada
        setTimeout(function () {
          li.classList.add('checklist__item--visible');
        }, 200 * (i + 1));
      });

      // Dato curioso
      var datoEl = document.getElementById('dato-curioso-texto');
      datoEl.textContent = p2.dato_curioso;
      datoEl.setAttribute('data-texto-normal', p2.dato_curioso);
      datoEl.setAttribute('data-texto-facil', p2.dato_curioso_facil);

      // Buscar casilla
      var mapaAyuda = document.getElementById('mapa-ayuda');
      var mapaResultado = document.getElementById('mapa-resultado');
      var mapaCasillaTexto = document.getElementById('mapa-casilla-texto');
      var usaFacil = function() { return document.body.classList.contains('lectura-facil'); };

      document.getElementById('btn-buscar-casilla').addEventListener('click', function () {
        var val = document.getElementById('input-seccion-mapa').value.trim();
        if (val) {
          mapaCasillaTexto.textContent = 'Sección ' + val + ' — Casilla Básica 1';
          var textoAyuda = usaFacil() ? p2.mapa.texto_ayuda_facil : p2.mapa.texto_ayuda;
          mapaAyuda.innerHTML = textoAyuda.replace(
            'ubicatucasilla.ine.mx',
            '<a href="https://ubicatucasilla.ine.mx" target="_blank" rel="noopener">ubicatucasilla.ine.mx</a>'
          );
          mapaResultado.classList.add('mapa-buscar__resultado--visible');
        }
      });

      function tomarAlAzar(arreglo, n) {
        var copia = arreglo.slice();
        for (var i = copia.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var temp = copia[i];
          copia[i] = copia[j];
          copia[j] = temp;
        }
        return copia.slice(0, n);
      }

      // Quiz
      var quizContenedor = document.getElementById('quiz-contenedor');
      var correctas = 0;
      var contestadas = 0;
      var preguntasSeleccionadas = tomarAlAzar(p2.quiz, 3);
      var total = preguntasSeleccionadas.length;
      var contadorEl = document.getElementById('quiz-contador');
      contadorEl.textContent = correctas + ' de ' + total + ' correctas';

      preguntasSeleccionadas.forEach(function (q, qi) {
        var div = document.createElement('div');
        div.className = 'tarjeta mb-1';

        var pregHTML = '<p class="quiz__pregunta">' + (qi + 1) + '. ' + q.pregunta + '</p>';
        pregHTML += '<div class="quiz__opciones">';
        q.opciones.forEach(function (op, oi) {
          pregHTML += '<button class="quiz__opcion" data-quiz="' + qi + '" data-opcion="' + oi + '">' + op + '</button>';
        });
        pregHTML += '</div>';
        pregHTML += '<div class="quiz__feedback" id="quiz-fb-' + qi + '" style="display:none"></div>';
        div.innerHTML = pregHTML;

        div.querySelectorAll('.quiz__opcion').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var qIdx = parseInt(btn.getAttribute('data-quiz'));
            var oIdx = parseInt(btn.getAttribute('data-opcion'));
            var esCorrecta = oIdx === preguntasSeleccionadas[qIdx].correcta;
            var feedback = document.getElementById('quiz-fb-' + qIdx);
            var opciones = div.querySelectorAll('.quiz__opcion');

            opciones.forEach(function (b) { b.disabled = true; });

            if (esCorrecta) {
              btn.classList.add('quiz__opcion--correcta');
              feedback.className = 'quiz__feedback quiz__feedback--correcto';
              feedback.textContent = '✅ ¡Correcto! ' + (document.body.classList.contains('lectura-facil')
                ? preguntasSeleccionadas[qIdx].explicacion_facil
                : preguntasSeleccionadas[qIdx].explicacion);
              correctas++;
            } else {
              btn.classList.add('quiz__opcion--incorrecta');
              opciones[p2.quiz[qIdx].correcta].classList.add('quiz__opcion--correcta');
              feedback.className = 'quiz__feedback quiz__feedback--incorrecto';
              feedback.textContent = '❌ ' + (document.body.classList.contains('lectura-facil')
                ? preguntasSeleccionadas[qIdx].explicacion_facil
                : preguntasSeleccionadas[qIdx].explicacion);
            }

            feedback.style.display = 'block';
            contestadas++;
            contadorEl.textContent = correctas + ' de ' + total + ' correctas';

            if (contestadas === total) {
              var btnSig = document.getElementById('btn-siguiente');
              btnSig.disabled = false;
              btnSig.title = '';
            }

            // Guardar score para pantalla 5
            sessionStorage.setItem('quizCorrectas', correctas);
            sessionStorage.setItem('quizTotal', total);
          });
        });

        quizContenedor.appendChild(div);
      });
    });
  </script>
</body>

</html>
