<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El gran día — Mi Primera Casilla</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/componentes.css">
  <link rel="stylesheet" href="styles/accesibilidad.css">
  <style>
    /* === Timeline vertical === */
    .timeline {
      position: relative;
      padding-left: 40px;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 15px;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--color-borde);
      border-radius: 3px;
    }

    .timeline__linea-progreso {
      position: absolute;
      left: 15px;
      top: 0;
      width: 3px;
      height: 0;
      background: var(--color-primario);
      border-radius: 3px;
      transition: height 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      z-index: 1;
    }

    .timeline__paso {
      position: relative;
      margin-bottom: 1.5rem;
      opacity: 0;
      transform: translateX(-20px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .timeline__paso--visible {
      opacity: 1;
      transform: translateX(0);
    }

    .timeline__dot {
      position: absolute;
      left: -33px;
      top: 0.5rem;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--color-borde);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--color-borde);
      transition: all 0.4s ease;
      z-index: 2;
    }

    .timeline__paso--visible .timeline__dot {
      background: var(--color-primario);
      border-color: var(--color-primario);
      color: #fff;
    }

    .timeline__tarjeta {
      background: #fff;
      border: 2px solid var(--color-borde);
      border-radius: var(--radio-borde);
      padding: 1.25rem;
      box-shadow: var(--sombra);
      transition: all 0.3s ease;
    }

    .timeline__paso--visible .timeline__tarjeta {
      border-color: rgba(139, 0, 0, 0.2);
    }

    .timeline__tarjeta:hover {
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
    }

    .timeline__header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .timeline__icono {
      font-size: 1.5rem;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.4s ease 0.2s;
    }

    .timeline__paso--visible .timeline__icono {
      opacity: 1;
    }


    .timeline__titulo {
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--color-secundario);
    }

    .timeline__texto {
      font-size: 0.9rem;
      color: #555;
      margin: 0;
      line-height: 1.5;
    }

    /* === Diálogo mejorado === */
    .dialogo-seccion {
      max-width: 420px;
      margin: 0 auto;
    }

    .dialogo__burbuja {
      animation: burbujaEntrada 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .dialogo__burbuja--funcionario {
      animation-name: burbujaIzq;
    }

    .dialogo__burbuja--tu {
      animation-name: burbujaDer;
    }

    @keyframes burbujaIzq {
      0% { opacity: 0; transform: translateX(-30px) scale(0.8); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }

    @keyframes burbujaDer {
      0% { opacity: 0; transform: translateX(30px) scale(0.8); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }

    /* Typing indicator */
    .dialogo__typing {
      display: flex;
      gap: 4px;
      padding: 0.75rem 1.1rem;
      background: #e3edf7;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      align-self: flex-start;
      max-width: 70px;
    }

    .dialogo__typing-dot {
      width: 8px;
      height: 8px;
      background: #999;
      border-radius: 50%;
      animation: typingBounce 1.2s ease-in-out infinite;
    }

    .dialogo__typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .dialogo__typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    .dialogo__avanzar {
      display: flex;
      justify-content: flex-end;
      margin-top: 0.75rem;
    }

    .dialogo__avanzar .btn {
      padding: 0.5rem 1.2rem;
      font-size: 0.85rem;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .dialogo__avanzar .btn:hover {
      transform: translateX(4px);
    }

    /* === Secciones animadas (solo fade) === */
    .seccion-animada {
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .seccion-animada--visible {
      opacity: 1;
    }

    /* === Dato curioso con pulso === */
    .dato-card {
      position: relative;
      overflow: hidden;
    }

    .dato-card::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(240, 165, 0, 0.06) 0%, transparent 60%);
      animation: pulseBg 3s ease infinite;
      pointer-events: none;
    }

    @keyframes pulseBg {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="barra-progreso"></div>

  <button class="acc-boton" aria-label="Opciones de accesibilidad" title="Accesibilidad">
     <img src="images/wheelchair-solid-full.svg" alt="ICONO">
  </button>
  <div class="acc-panel" role="dialog" aria-label="Panel de accesibilidad">
    <div class="acc-panel__titulo">Accesibilidad</div>
    <button class="acc-panel__opcion" data-acc="voz"><span class="acc-panel__icono">🔊</span> Narración por voz</button>
    <button class="acc-panel__opcion" data-acc="lectura_facil"><span class="acc-panel__icono">📖</span> Lectura fácil</button>
    <button class="acc-panel__opcion" data-acc="alto_contraste"><span class="acc-panel__icono">🌗</span> Alto contraste</button>
  </div>
  <div class="voz-controles" aria-label="Controles de narración">
    <button class="voz-controles__btn voz-btn-pausar" aria-label="Pausar" title="Pausar">⏸️</button>
    <button class="voz-controles__btn voz-btn-repetir" aria-label="Repetir" title="Repetir">🔁</button>
    <button class="voz-controles__btn voz-btn-detener" aria-label="Detener" title="Detener">⏹️</button>
  </div>

  <main class="pantalla">
    <div class="contenido-principal">
      <section class="text-center mb-2">
        <h1>El gran día</h1>
        <p data-texto-normal="Llegando a la casilla"
           data-texto-facil="Aquí verás cómo es llegar a votar.">Llegando a la casilla</p>
      </section>

      <!-- A) Timeline de pasos -->
      <section class="mb-3" id="seccion-pasos">
        <h2 class="mb-2">¿Qué pasa cuando llegas?</h2>
        <div class="timeline" id="timeline">
          <div class="timeline__linea-progreso" id="timeline-progreso"></div>
        </div>
      </section>

      <!-- B) Diálogo simulado -->
      <section class="mb-3 seccion-animada" id="seccion-dialogo">
        <hr class="separador">
        <h2 class="mb-1 text-center">Conversación con los funcionarios</h2>
        <p class="text-center mb-1" style="font-size:0.9rem; color:#666;">Así será tu interacción en la casilla:</p>
        <div class="dialogo dialogo-seccion" id="dialogo-contenedor" role="log" aria-label="Conversación simulada con funcionarios de casilla">
        </div>
        <div class="dialogo__avanzar" id="dialogo-avanzar" style="max-width:420px; margin:0.75rem auto 0;">
          <button class="btn btn--secundario" id="btn-dialogo">Continuar conversación →</button>
        </div>
      </section>

      <!-- Dato curioso -->
      <div class="tarjeta tarjeta--destacada dato-lateral dato-lateral--der mb-3 dato-card seccion-animada" id="dato-curioso-p3">
        <strong>Dato curioso</strong>
        <p class="mt-1" id="dato-p3-texto"
           data-texto-normal="" data-texto-facil=""></p>
      </div>

      <button class="btn btn--primario btn--grande"
              onclick="irAPantalla('pantalla4.html')">
        Siguiente: En la casilla →
      </button>
    </div>
  </main>

  <script src="js/navegacion.js"></script>
  <script src="js/accesibilidad.js"></script>
  <script>
    renderBarraProgreso(3, document.getElementById('barra-progreso'));

    // Scroll reveal para secciones (solo fade, sin desplazamiento)
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('seccion-animada--visible');
        }
      });
    }, { threshold: 0.15 });

    document.querySelectorAll('.seccion-animada').forEach(function(el) {
      observer.observe(el);
    });

    cargarContenido().then(function(data) {
      var p3 = data.pantallas.p3;

      // Timeline de pasos
      var timelineEl = document.getElementById('timeline');
      var progreso = document.getElementById('timeline-progreso');
      var totalPasos = p3.pasos_llegada.length;

      // Agregar todos los items al DOM primero
      var pasoDivs = [];
      p3.pasos_llegada.forEach(function(paso, i) {
        var div = document.createElement('div');
        div.className = 'timeline__paso';
        div.innerHTML =
          '<div class="timeline__dot">' + (i + 1) + '</div>' +
          '<div class="timeline__tarjeta">' +
            '<div class="timeline__header">' +
              '<span class="timeline__icono">' + paso.icono + '</span>' +
              '<span class="timeline__titulo">' + paso.titulo + '</span>' +
            '</div>' +
            '<p class="timeline__texto" data-texto-normal="' + paso.texto + '" data-texto-facil="' + paso.texto_facil + '">' + paso.texto + '</p>' +
          '</div>';
        timelineEl.appendChild(div);
        pasoDivs.push(div);
      });

      // Animar entrada escalonada
      pasoDivs.forEach(function(div, i) {
        setTimeout(function() {
          div.classList.add('timeline__paso--visible');
          progreso.style.height = (((i + 1) / totalPasos) * 100) + '%';
        }, 400 * (i + 1));
      });

      // Diálogo con typing indicator
      var dialogoEl = document.getElementById('dialogo-contenedor');
      var btnDialogo = document.getElementById('btn-dialogo');
      var dialogoAvanzar = document.getElementById('dialogo-avanzar');
      var dialogoIdx = 0;
      var animando = false;
      var usaFacil = function() { return document.body.classList.contains('lectura-facil'); };

      function mostrarBurbuja() {
        if (dialogoIdx >= p3.dialogo.length || animando) return;
        animando = true;

        var msg = p3.dialogo[dialogoIdx];
        var esFuncionario = msg.quien === 'funcionario';

        // Mostrar typing indicator para funcionario
        if (esFuncionario) {
          var typing = document.createElement('div');
          typing.className = 'dialogo__typing';
          typing.innerHTML = '<div class="dialogo__typing-dot"></div><div class="dialogo__typing-dot"></div><div class="dialogo__typing-dot"></div>';
          dialogoEl.appendChild(typing);

          setTimeout(function() {
            dialogoEl.removeChild(typing);
            agregarBurbuja(msg, esFuncionario);
          }, 800);
        } else {
          agregarBurbuja(msg, esFuncionario);
        }
      }

      function agregarBurbuja(msg, esFuncionario) {
        var burbuja = document.createElement('div');
        burbuja.className = 'dialogo__burbuja ' +
          (esFuncionario ? 'dialogo__burbuja--funcionario' : 'dialogo__burbuja--tu');

        var etiqueta = esFuncionario ? 'Funcionario' : 'Tú';
        var texto = usaFacil() ? msg.texto_facil : msg.texto;

        burbuja.innerHTML = '<div class="dialogo__etiqueta">' + etiqueta + '</div>' + texto;
        dialogoEl.appendChild(burbuja);

        dialogoIdx++;
        animando = false;

        if (dialogoIdx >= p3.dialogo.length) {
          btnDialogo.textContent = '✓ Conversación completa';
          btnDialogo.disabled = true;
          btnDialogo.style.opacity = '0.5';
        }
      }

      mostrarBurbuja();

      btnDialogo.addEventListener('click', function() {
        mostrarBurbuja();
      });

      // Dato curioso
      var datoEl = document.getElementById('dato-p3-texto');
      datoEl.textContent = p3.dato_curioso;
      datoEl.setAttribute('data-texto-normal', p3.dato_curioso);
      datoEl.setAttribute('data-texto-facil', p3.dato_curioso_facil);

    });
  </script>
</body>
</html>
