<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" fill="none">
  <!-- Tarjeta base -->
  <rect x="4" y="4" width="472" height="292" rx="10" fill="#eae6df" stroke="#b5b0a6" stroke-width="1.5"/>

  <!-- Franja rosa izquierda -->
  <rect x="4" y="14" width="12" height="272" fill="#c97a8a" rx="0"/>

  <!-- Header -->
  <circle cx="50" cy="28" r="16" fill="none" stroke="#888" stroke-width="1.2" opacity="0.5"/>
  <text x="50" y="32" text-anchor="middle" font-family="serif" font-size="8" fill="#888" font-weight="700">MX</text>
  <text x="74" y="22" font-family="Arial, sans-serif" font-size="9" fill="#555" font-weight="600">MÉXICO</text>
  <text x="150" y="22" font-family="Arial, sans-serif" font-size="12" font-weight="800" fill="#333" letter-spacing="1.5">INSTITUTO NACIONAL ELECTORAL</text>
  <text x="150" y="38" font-family="Arial, sans-serif" font-size="8.5" fill="#555" letter-spacing="2" font-weight="600">CREDENCIAL PARA VOTAR</text>

  <!-- Foto placeholder -->
  <rect x="28" y="55" width="105" height="130" rx="3" fill="#d8d4cb" stroke="#b5b0a6" stroke-width="1"/>
  <circle cx="80" cy="92" r="22" fill="#c2bdb4"/>
  <rect x="55" y="118" width="50" height="45" rx="14" fill="#c2bdb4"/>

  <!-- NOMBRE -->
  <text x="148" y="65" font-family="Arial, sans-serif" font-size="7.5" fill="#888" font-weight="600">NOMBRE</text>
  <text x="148" y="80" font-family="Arial, sans-serif" font-size="13" fill="#333" font-weight="700">GOMEZ</text>
  <text x="148" y="96" font-family="Arial, sans-serif" font-size="13" fill="#333" font-weight="700">VELAZQUEZ</text>
  <text x="148" y="112" font-family="Arial, sans-serif" font-size="13" fill="#333" font-weight="700">MARGARITA</text>

  <!-- SEXO -->
  <text x="410" y="65" font-family="Arial, sans-serif" font-size="7.5" fill="#888" font-weight="600">SEXO</text>
  <text x="440" y="65" font-family="Arial, sans-serif" font-size="10" fill="#333" font-weight="700">M</text>

  <!-- DOMICILIO -->
  <text x="148" y="130" font-family="Arial, sans-serif" font-size="7.5" fill="#c97a8a" font-weight="600">DOMICILIO</text>
  <text x="148" y="143" font-family="Arial, sans-serif" font-size="9.5" fill="#444">VIADUCTO TLALPAN NO 100</text>
  <text x="148" y="155" font-family="Arial, sans-serif" font-size="9.5" fill="#444">COL. ARENAL TEPEPAN, ALCALDIA</text>
  <text x="148" y="167" font-family="Arial, sans-serif" font-size="9.5" fill="#444">TLALPAN. C.P. 14610, CDMX.</text>

  <!-- Huella derecha -->
  <rect x="400" y="80" width="60" height="80" rx="4" fill="#d8d4cb" stroke="#b5b0a6" stroke-width="0.8"/>
  <text x="430" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#aaa">HUELLA</text>

  <!-- CLAVE DE ELECTOR -->
  <text x="148" y="185" font-family="Arial, sans-serif" font-size="7" fill="#888" font-weight="600">CLAVE DE ELECTOR</text>
  <text x="280" y="185" font-family="Arial, sans-serif" font-size="10" fill="#333" font-weight="700" letter-spacing="0.5">GMVLMR80070501M100</text>

  <!-- CURP y AÑO DE REGISTRO -->
  <text x="148" y="200" font-family="Arial, sans-serif" font-size="7" fill="#c97a8a" font-weight="600">CURP</text>
  <text x="148" y="213" font-family="Arial, sans-serif" font-size="9.5" fill="#333" font-weight="700">GOVM800705MCLMLR01</text>
  <text x="350" y="200" font-family="Arial, sans-serif" font-size="7" fill="#888" font-weight="600">AÑO DE REGISTRO</text>
  <text x="350" y="213" font-family="Arial, sans-serif" font-size="10" fill="#333" font-weight="700">2008 01</text>

  <!-- Firma -->
  <text x="40" y="208" font-family="'Brush Script MT', cursive, serif" font-size="18" fill="#444" font-style="italic" transform="rotate(-5, 60, 205)">Margarita</text>

  <!-- Línea separadora inferior -->
  <line x1="28" y1="222" x2="460" y2="222" stroke="#c5c0b6" stroke-width="0.8"/>

  <!-- FECHA DE NACIMIENTO -->
  <text x="30" y="236" font-family="Arial, sans-serif" font-size="7" fill="#888" font-weight="600">FECHA DE NACIMIENTO</text>
  <text x="30" y="252" font-family="Arial, sans-serif" font-size="11" fill="#333" font-weight="700">05/07/1980</text>

  <!-- SECCIÓN - DESTACADA -->
  <rect x="193" y="225" width="95" height="40" rx="7" fill="#FFF3E0" stroke="#E65100" stroke-width="2.5"/>
  <text x="210" y="237" font-family="Arial, sans-serif" font-size="7.5" font-weight="700" fill="#E65100">SECCIÓN</text>
  <text x="210" y="255" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#E65100" letter-spacing="2">0001</text>

  <!-- Flecha indicadora -->
  <path d="M 295 245 L 318 245" stroke="#E65100" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 314 240 L 322 245 L 314 250" fill="#E65100"/>
  <rect x="326" y="233" width="130" height="26" rx="6" fill="#E65100" opacity="0.1"/>
  <text x="338" y="246" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" fill="#E65100">Aquí está tu sección</text>
  <text x="338" y="258" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" fill="#E65100">electoral</text>

  <!-- VIGENCIA (a la derecha de sección, pero debajo de la flecha) -->
  <text x="30" y="275" font-family="Arial, sans-serif" font-size="7" fill="#888" font-weight="600">VIGENCIA</text>
  <text x="30" y="288" font-family="Arial, sans-serif" font-size="10" fill="#333" font-weight="700">2019 - 2029</text>
</svg>